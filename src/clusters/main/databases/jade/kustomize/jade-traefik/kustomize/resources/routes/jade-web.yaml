# Create web ingress route for jade
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jade-web
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`web.jade.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the jade service
        - name: jade
          # This is the name of the port in the service
          port: web
