# Create S3 ingress route for minium
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minium
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`minium.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the minium service
        - name: minium
          # This is the name of the port in the service
          port: s3
