# Create HTTP ingress route for sunflower
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: start-internal
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`start.radioaktywne.pl`)
      kind: Rule
      middlewares:
        # Use impersonation middleware
        - name: impersonate
          namespace: traefik
      services:
        # Route traffic to the sunflower service
        - name: sunflower
          # This is the name of the port in the service
          port: http
