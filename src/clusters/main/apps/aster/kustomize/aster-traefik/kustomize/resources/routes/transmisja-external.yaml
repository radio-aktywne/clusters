# Create HTTP ingress route for aster
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: transmisja-external
spec:
  entryPoints:
    # Use entrypoint for external HTTP traffic
    - http-external
  routes:
    # Match traffic with the Host header
    - match: Host(`transmisja.radioaktywne.pl`)
      kind: Rule
      middlewares:
        # Use OIDC middleware
        - name: oidc
          namespace: traefik
      services:
        # Route traffic to the aster service
        - name: aster
          # This is the name of the port in the service
          port: http
