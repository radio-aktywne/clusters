# Create HTTP ingress route for sunflower
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: start-external
spec:
  entryPoints:
    # Use entrypoint for external HTTP traffic
    - http-external
  routes:
    # Match traffic with the Host header
    - match: Host(`start.radioaktywne.pl`)
      kind: Rule
      middlewares:
        # Use OIDC middleware
        - name: oidc
          namespace: traefik
      services:
        # Route traffic to the sunflower service
        - name: sunflower
          # This is the name of the port in the service
          port: http
