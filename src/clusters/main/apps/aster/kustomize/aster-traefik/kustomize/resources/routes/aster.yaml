# Create HTTP ingress route for aster
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aster
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`aster.k8s.radioaktywne.pl`)
      kind: Rule
      middlewares:
        # Use OIDC middleware
        - name: oidc
          namespace: traefik
      services:
        # Route traffic to the aster service
        - name: aster
          # This is the name of the port in the service
          port: http
