# Create HTTP ingress route for dingo
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dingo
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`dingo.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the dingo service
        - name: dingo
          # This is the name of the port in the service
          port: http
