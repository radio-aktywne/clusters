# Create HTTP ingress route for longhorn
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Enable OIDC when requested by the header
    - match: >-
        Host(`longhorn.k8s.radioaktywne.pl`) &&
        Header(`X-Traefik-Middleware-OIDC`, `true`)
      kind: Rule
      priority: 20
      middlewares:
        # Use OIDC middleware
        - name: oidc
          namespace: traefik
      services:
        # Route traffic to the longhorn-frontend service
        - name: longhorn-frontend
          # This is the name of the port in the service
          port: http
    # Bypass middleware by default
    - match: Host(`longhorn.k8s.radioaktywne.pl`)
      kind: Rule
      priority: 10
      services:
        # Route traffic to the longhorn-frontend service
        - name: longhorn-frontend
          # This is the name of the port in the service
          port: http
