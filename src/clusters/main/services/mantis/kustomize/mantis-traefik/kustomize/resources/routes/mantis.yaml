# Create HTTP ingress route for mantis
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mantis
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`mantis.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the mantis service
        - name: mantis
          # This is the name of the port in the service
          port: http
