# Create HTTP ingress route for daisy
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: operacje-external
spec:
  entryPoints:
    # Use entrypoint for external HTTP traffic
    - http-external
  routes:
    # Match traffic with the Host header
    - match: Host(`operacje.radioaktywne.pl`)
      kind: Rule
      middlewares:
        # Use OIDC middleware
        - name: oidc
          namespace: traefik
      services:
        # Route traffic to the daisy service
        - name: daisy
          # This is the name of the port in the service
          port: http
