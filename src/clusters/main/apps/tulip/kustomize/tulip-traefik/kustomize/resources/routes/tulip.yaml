# Create HTTP ingress route for tulip
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tulip
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Enable OIDC when requested by the header
    - match: >-
        Host(`tulip.k8s.radioaktywne.pl`) &&
        Header(`X-Traefik-Middleware-OIDC`, `true`)
      kind: Rule
      priority: 20
      middlewares:
        # Use OIDC middleware
        - name: oidc
          namespace: traefik
      services:
        # Route traffic to the tulip service
        - name: tulip
          # This is the name of the port in the service
          port: http
    # Use impersonation by default
    - match: Host(`tulip.k8s.radioaktywne.pl`)
      kind: Rule
      priority: 10
      middlewares:
        # Use impersonation middleware
        - name: impersonate
          namespace: traefik
      services:
        # Route traffic to the tulip service
        - name: tulip
          # This is the name of the port in the service
          port: http
