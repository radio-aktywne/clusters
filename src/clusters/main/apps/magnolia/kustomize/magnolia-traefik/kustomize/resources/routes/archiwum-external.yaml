# Create HTTP ingress route for magnolia
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: archiwum-external
spec:
  entryPoints:
    # Use entrypoint for external HTTP traffic
    - http-external
  routes:
    # Match traffic with the Host header
    - match: Host(`archiwum.radioaktywne.pl`)
      kind: Rule
      middlewares:
        # Use OIDC middleware
        - name: oidc
          namespace: traefik
      services:
        # Route traffic to the magnolia service
        - name: magnolia
          # This is the name of the port in the service
          port: http
