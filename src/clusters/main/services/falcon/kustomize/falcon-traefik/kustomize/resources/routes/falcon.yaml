# Create public ingress route for falcon
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: falcon
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`falcon.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the falcon service
        - name: falcon
          # This is the name of the port in the service
          port: public
