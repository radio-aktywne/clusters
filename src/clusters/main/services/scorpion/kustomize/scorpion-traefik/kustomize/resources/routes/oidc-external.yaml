# Create public ingress route for scorpion
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: oidc-external
spec:
  entryPoints:
    # Use entrypoint for external HTTP traffic
    - http-external
  routes:
    # Match traffic with the Host header
    - match: Host(`oidc.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the scorpion service
        - name: scorpion
          # This is the name of the port in the service
          port: public
