# Create HTTP ingress route for lotus
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: playlisty-external
spec:
  entryPoints:
    # Use entrypoint for external HTTP traffic
    - http-external
  routes:
    # Match traffic with the Host header
    - match: Host(`playlisty.radioaktywne.pl`)
      kind: Rule
      middlewares:
        # Use OIDC middleware
        - name: oidc
          namespace: traefik
      services:
        # Route traffic to the lotus service
        - name: lotus
          # This is the name of the port in the service
          port: http
