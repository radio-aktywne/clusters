# Create HTTP ingress route for howlite
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: howlite
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`howlite.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the howlite service
        - name: howlite
          # This is the name of the port in the service
          port: http
