# Create S3 ingress route for amber
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: amber
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`amber.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the amber service
        - name: amber
          # This is the name of the port in the service
          port: s3
