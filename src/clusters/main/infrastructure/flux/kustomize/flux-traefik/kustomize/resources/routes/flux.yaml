# Create HTTP ingress route for flux
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flux
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`flux.k8s.radioaktywne.pl`)
      kind: Rule
      middlewares:
        # Use OIDC middleware
        - name: oidc
          namespace: traefik
      services:
        # Route traffic to the flux-operator service
        - name: flux-operator
          # This is the name of the port in the service
          port: http-web
