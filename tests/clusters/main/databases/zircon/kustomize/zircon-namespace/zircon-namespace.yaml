# Create zircon-namespace Kustomization
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zircon-namespace
spec:
  # Path inside repository to a directory containing Kustomization files
  path: tests/clusters/main/databases/zircon/kustomize/zircon-namespace/kustomize
  # This key always needs to be here for patching to work
  patches: []
