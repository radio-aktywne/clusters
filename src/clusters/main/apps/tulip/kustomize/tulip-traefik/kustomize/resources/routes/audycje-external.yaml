# Create HTTP ingress route for tulip
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: audycje-external
spec:
  entryPoints:
    # Use entrypoint for external HTTP traffic
    - http-external
  routes:
    # Match traffic with the Host header
    - match: Host(`audycje.radioaktywne.pl`)
      kind: Rule
      middlewares:
        # Use OIDC middleware
        - name: oidc
          namespace: traefik
      services:
        # Route traffic to the tulip service
        - name: tulip
          # This is the name of the port in the service
          port: http
