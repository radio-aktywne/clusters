# Create HTTP ingress route for orchid
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: konto-external
spec:
  entryPoints:
    # Use entrypoint for external HTTP traffic
    - http-external
  routes:
    # Match traffic with the Host header
    - match: Host(`konto.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the orchid service
        - name: orchid
          # This is the name of the port in the service
          port: http
