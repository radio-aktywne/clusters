# Create HTTP ingress route for daisy
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: daisy
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`daisy.k8s.radioaktywne.pl`)
      kind: Rule
      middlewares:
        # Use OIDC middleware
        - name: oidc
          namespace: traefik
      services:
        # Route traffic to the daisy service
        - name: daisy
          # This is the name of the port in the service
          port: http
