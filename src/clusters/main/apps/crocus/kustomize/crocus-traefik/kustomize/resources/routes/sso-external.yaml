# Create HTTP ingress route for crocus
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sso-external
spec:
  entryPoints:
    # Use entrypoint for external HTTP traffic
    - http-external
  routes:
    # Match traffic with the Host header
    - match: Host(`sso.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the crocus service
        - name: crocus
          # This is the name of the port in the service
          port: http
