# Create WHIP ingress route for loris
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loris-whip
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`whip.loris.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the loris service
        - name: loris
          # This is the name of the port in the service
          port: whip
