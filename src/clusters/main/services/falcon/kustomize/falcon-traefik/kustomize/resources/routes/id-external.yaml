# Create public ingress route for falcon
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: id-external
spec:
  entryPoints:
    # Use entrypoint for external HTTP traffic
    - http-external
  routes:
    # Match traffic with the Host header
    - match: Host(`id.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the falcon service
        - name: falcon
          # This is the name of the port in the service
          port: public
