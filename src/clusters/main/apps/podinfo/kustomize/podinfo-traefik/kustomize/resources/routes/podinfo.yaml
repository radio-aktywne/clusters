# Create HTTP ingress route for podinfo
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: podinfo
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`podinfo.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the podinfo service
        - name: podinfo
          # This is the name of the port in the service
          port: http
