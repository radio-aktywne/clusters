# Create falcon Helm release
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falcon
spec:
  chart:
    spec:
      # Use this chart from the repository
      chart: falcon
      # Pin version to major
      version: "0.x"
      # Use this Helm repository
      sourceRef:
        kind: HelmRepository
        name: radio-aktywne
  # This key always needs to be here for patching to work
  postRenderers: []
  values:
    falcon:
      urls:
        public: https://id.radioaktywne.pl
        admin: https://admin.falcon.k8s.radioaktywne.pl
      cookies:
        domain: radioaktywne.pl
      orchid:
        public:
          scheme: https
          host: konto.radioaktywne.pl
          port: null
      redirects:
        allowed:
          - https://archiwum.radioaktywne.pl
          - https://audycje.radioaktywne.pl
          - https://nagrania.radioaktywne.pl
          - https://operacje.radioaktywne.pl
          - https://playlisty.radioaktywne.pl
          - https://start.radioaktywne.pl
          - https://studio.radioaktywne.pl
          - https://transmisja.radioaktywne.pl
          - https://aster.k8s.radioaktywne.pl
          - https://daisy.k8s.radioaktywne.pl
          - https://jasmine.k8s.radioaktywne.pl
          - https://lotus.k8s.radioaktywne.pl
          - https://magnolia.k8s.radioaktywne.pl
          - https://poppy.k8s.radioaktywne.pl
          - https://sunflower.k8s.radioaktywne.pl
          - https://tulip.k8s.radioaktywne.pl
      oidc:
        google:
          domain: radioaktywne.pl
      debug: false
  valuesFrom:
    - kind: Secret
      name: falcon-helm-secrets-values
      valuesKey: values.yaml
