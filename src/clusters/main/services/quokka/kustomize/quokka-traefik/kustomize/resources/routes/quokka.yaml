# Create HTTP ingress route for quokka
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: quokka
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`quokka.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the quokka service
        - name: quokka
          # This is the name of the port in the service
          port: http
