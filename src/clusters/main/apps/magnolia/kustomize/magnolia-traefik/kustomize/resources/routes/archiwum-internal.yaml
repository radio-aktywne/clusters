# Create HTTP ingress route for magnolia
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: archiwum-internal
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`archiwum.radioaktywne.pl`)
      kind: Rule
      middlewares:
        # Use impersonation middleware
        - name: impersonate
          namespace: traefik
      services:
        # Route traffic to the magnolia service
        - name: magnolia
          # This is the name of the port in the service
          port: http
