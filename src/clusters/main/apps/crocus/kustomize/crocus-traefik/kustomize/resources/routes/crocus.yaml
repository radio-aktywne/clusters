# Create HTTP ingress route for crocus
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crocus
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`crocus.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the crocus service
        - name: crocus
          # This is the name of the port in the service
          port: http
