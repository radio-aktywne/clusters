# Create public ingress route for scorpion
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: scorpion
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`scorpion.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the scorpion service
        - name: scorpion
          # This is the name of the port in the service
          port: public
