# Create HTTP ingress route for numbat
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: numbat
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`numbat.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the numbat service
        - name: numbat
          # This is the name of the port in the service
          port: http
