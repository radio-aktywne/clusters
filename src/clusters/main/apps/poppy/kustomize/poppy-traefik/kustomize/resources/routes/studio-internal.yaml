# Create HTTP ingress route for poppy
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: studio-internal
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`studio.radioaktywne.pl`)
      kind: Rule
      middlewares:
        # Use impersonation middleware
        - name: impersonate
          namespace: traefik
      services:
        # Route traffic to the poppy service
        - name: poppy
          # This is the name of the port in the service
          port: http
