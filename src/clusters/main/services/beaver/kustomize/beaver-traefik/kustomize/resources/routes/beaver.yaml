# Create HTTP ingress route for beaver
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: beaver
spec:
  entryPoints:
    # Use entrypoint for internal HTTP traffic
    - https-internal
  routes:
    # Match traffic with the Host header
    - match: Host(`beaver.k8s.radioaktywne.pl`)
      kind: Rule
      services:
        # Route traffic to the beaver service
        - name: beaver
          # This is the name of the port in the service
          port: http
